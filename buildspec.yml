version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - REPOSITORY_NAME=ando-backend
      - IMAGE_TAG=latest
      - echo "ECR URI = ${ECR_URI}"
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_URI}

  build:
    commands:
      - echo "Building Ando backend Docker image..."
      - docker build -t ${REPOSITORY_NAME}:${IMAGE_TAG} ./backend
      - docker tag ${REPOSITORY_NAME}:${IMAGE_TAG} ${ECR_URI}/${REPOSITORY_NAME}:${IMAGE_TAG}

  post_build:
    commands:
      - echo "Pushing image to Amazon ECR..."
      - docker push ${ECR_URI}/${REPOSITORY_NAME}:${IMAGE_TAG}
      - echo "Build completed successfully."
      - echo "Image = ${ECR_URI}/${REPOSITORY_NAME}:${IMAGE_TAG}"
