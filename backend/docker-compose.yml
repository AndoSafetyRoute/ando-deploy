services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ando-backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      # 대용량 경사도 데이터와 생성된 pickle 캐시 유지
      - ./data:/app/data

      # Firebase 키를 읽기 전용으로 연결
      - ./firebase-key.json:/app/firebase-key.json:ro

    restart: unless-stopped

    deploy:
      resources:
        limits:
          # CCH 부팅 피크 ~9.4GB 실측(release_v10, 노드 2,027,476) — 6G/10G 는 OOM 위험
          memory: 12G
        reservations:
          memory: 8G